<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TissueSense — Physics-Informed Force Estimation</title>
<style>
  :root{
    --navy:#0F1E2E;
    --navy-2:#16283C;
    --teal:#0F6E56;
    --teal-light:#1D9E75;
    --blue:#185FA5;
    --blue-light:#378ADD;
    --bg:#F4F6F7;
    --card:#FFFFFF;
    --border:#D8DEE2;
    --text:#1B2A33;
    --text-muted:#5C6B73;
    --elastic:#378ADD;
    --viscous:#1D9E75;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#fff;
    padding:28px 32px 20px;
  }
  header h1{
    margin:0 0 4px;
    font-size:26px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  header .tagline{
    margin:0;
    font-size:14px;
    color:#A9C4D8;
    font-weight:400;
  }
  .accent-line{
    height:3px;
    width:64px;
    background:linear-gradient(90deg,var(--teal-light),var(--blue-light));
    border-radius:2px;
    margin-top:12px;
  }
  .global-bar{
    background:var(--navy-2);
    border-top:1px solid rgba(255,255,255,0.08);
    padding:14px 32px;
    display:flex;
    flex-wrap:wrap;
    gap:22px;
    align-items:center;
    position:sticky;
    top:0;
    z-index:20;
  }
  .control{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .control label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#8FA9BB;
    font-weight:600;
  }
  .control select{
    background:#fff;
    border:none;
    border-radius:6px;
    padding:7px 10px;
    font-size:13px;
    font-weight:600;
    color:var(--navy);
    min-width:150px;
  }
  .toggle-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .toggle-wrap label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:#8FA9BB;
    font-weight:600;
  }
  .switch{
    position:relative;
    width:36px;
    height:20px;
    background:#3A4E5E;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s;
  }
  .switch.on{background:var(--teal-light);}
  .switch .knob{
    position:absolute;
    top:2px;
    left:2px;
    width:16px;
    height:16px;
    background:#fff;
    border-radius:50%;
    transition:transform .15s;
  }
  .switch.on .knob{transform:translateX(16px);}

  nav.tabs{
    display:flex;
    gap:2px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:0 32px;
    overflow-x:auto;
  }
  nav.tabs button{
    border:none;
    background:transparent;
    padding:14px 16px;
    font-size:13px;
    font-weight:500;
    color:var(--text-muted);
    cursor:pointer;
    white-space:nowrap;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{
    color:var(--navy);
    border-bottom-color:var(--teal-light);
    font-weight:600;
  }
  main{
    padding:28px 32px 60px;
    max-width:1100px;
    margin:0 auto;
  }
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .grid-2{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
  }
  .card h3{
    margin:0 0 4px;
    font-size:15px;
    font-weight:600;
  }
  .card .sub{
    margin:0 0 16px;
    font-size:12px;
    color:var(--text-muted);
  }
  .slider-row{
    margin-bottom:16px;
  }
  .slider-row .label-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--text-muted);
    margin-bottom:6px;
  }
  .slider-row .label-row span.val{
    font-weight:600;
    color:var(--navy);
  }
  input[type=range]{
    width:100%;
    accent-color:var(--teal);
  }
  .plots-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:20px;
  }
  canvas{
    width:100%;
    height:180px;
    background:#FBFCFD;
    border:1px solid var(--border);
    border-radius:8px;
  }
  .panels-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .panels-row.mc-off{
    grid-template-columns:1fr;
  }
  .ci-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:13px;
    margin-bottom:10px;
  }
  .ci-row .name{width:20px;font-weight:600;color:var(--navy);}
  .ci-bar{
    flex:1;
    height:6px;
    background:#EDF1F3;
    border-radius:3px;
    position:relative;
  }
  .ci-bar .fill{
    position:absolute;top:0;bottom:0;
    background:var(--blue-light);
    border-radius:3px;
  }
  .stack-bar{
    display:flex;
    height:28px;
    border-radius:6px;
    overflow:hidden;
    margin:10px 0 8px;
  }
  .stack-bar .elastic{background:var(--elastic);}
  .stack-bar .viscous{background:var(--viscous);}
  .legend{
    display:flex;
    gap:16px;
    font-size:12px;
    color:var(--text-muted);
  }
  .legend .dot{
    display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;
  }
  .legend .elastic-dot{background:var(--elastic);}
  .legend .viscous-dot{background:var(--viscous);}
  .note{
    font-size:11px;
    color:var(--text-muted);
    margin-top:10px;
    font-style:italic;
  }
  .placeholder-card ul{
    margin:0;
    padding-left:18px;
    font-size:13px;
    color:var(--text-muted);
    line-height:1.8;
  }
  .badge{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:3px 8px;
    border-radius:20px;
    background:#EAF3EF;
    color:var(--teal);
    margin-bottom:10px;
  }
  .badge.future{background:#FDF2E4;color:#B06A18;}
  @media (max-width:760px){
    .grid-2{grid-template-columns:1fr;}
    .plots-row, .panels-row{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <h1>TissueSense</h1>
  <p class="tagline">Physics-informed force estimation for haptic feedback in simulated robotic surgery</p>
  <div class="accent-line"></div>
</header>

<div class="global-bar">
  <div class="control">
    <label>Tissue type</label>
    <select id="tissueType">
      <option>Liver</option>
      <option>Skin</option>
      <option>Muscle</option>
      <option>Fat</option>
    </select>
  </div>
  <div class="control">
    <label>Viscoelastic model</label>
    <select id="modelType">
      <option>Kelvin-Voigt</option>
      <option disabled>Maxwell (coming soon)</option>
      <option disabled>Standard Linear Solid (Zener) (coming soon)</option>
      <option disabled>Generalized Maxwell (coming soon)</option>
      <option disabled>Fung's QLV (coming soon)</option>
      <option disabled>Fractional-order (coming soon)</option>
    </select>
  </div>
  <div class="control">
    <label>Tool type <span style="opacity:.6;font-weight:400;">(future work)</span></label>
    <select id="toolType">
      <option>Needle tip</option>
      <option>Flat grasper</option>
      <option>Spherical probe</option>
    </select>
  </div>
  <div class="toggle-wrap">
    <label>Monte Carlo</label>
    <div class="switch on" id="mcToggle" onclick="toggleMonteCarlo()"><div class="knob"></div></div>
  </div>
</div>

<nav class="tabs" id="tabNav"></nav>

<main>
  <div id="tabContent"></div>
</main>

<script>
const tabs = [
  {id:"physics", label:"Physics model", ready:true},
  {id:"tool", label:"Tool & contact", ready:false, items:[
    "Indentation velocity slider (0.5–50 mm/s) with slow/typical/fast presets",
    "Cyclic loading toggle + cycle-count slider — hysteresis loop + preconditioning curve",
    "Tool tip geometry dropdown (needle / flat grasper / spherical probe)",
    "Lateral/shear motion toggle — decomposes normal vs. tangential force"
  ]},
  {id:"structure", label:"Tissue structure", ready:false, items:[
    "Heterogeneous tissue toggle",
    "2D cross-section map to place an embedded vessel/tumor at chosen depth",
    "Stiffness-ratio control vs. background tissue",
    "Optional temperature slider (20–45°C), advanced/optional"
  ]},
  {id:"sensor", label:"Sensor simulation", ready:false, items:[
    "Gaussian noise standard deviation slider",
    "Sensor/communication latency slider (ms)",
    "Raw signal vs. true force vs. PINN-recovered estimate plot"
  ]},
  {id:"validation", label:"Validation", ready:false, items:[
    "PINN prediction vs. synthetic ground truth (CoppeliaSim)",
    "RMSE / R² metric cards",
    "Residual plot"
  ]},
  {id:"comparison", label:"Model comparison", ready:false, items:[
    "Ranking table: PINN vs. LSTM/MLP baseline vs. pure physics model",
    "Compared across scenarios from Tool & contact / Tissue structure tabs"
  ]},
  {id:"sensitivity", label:"Sensitivity & uncertainty", ready:false, items:[
    "Tornado chart (±5% parameter variation)",
    "Monte Carlo uncertainty decomposition",
    "PINN stage — uncertainty: MC Dropout / Deep Ensembles",
    "PINN stage — explainability: SHAP / feature attribution"
  ]},
  {id:"haptic", label:"Haptic preview", ready:false, items:[
    "Animated force-vs-time playback",
    "Synchronized needle/gauge indicator"
  ]},
  {id:"library", label:"Scenario library", ready:false, items:[
    "Save/load named presets",
    "Export current configuration + plots as PDF/report"
  ]},
];

const tabNav = document.getElementById("tabNav");
const tabContent = document.getElementById("tabContent");

tabs.forEach((t,i)=>{
  const btn = document.createElement("button");
  btn.textContent = t.label;
  btn.dataset.id = t.id;
  if(i===0) btn.classList.add("active");
  btn.onclick = ()=> showTab(t.id);
  tabNav.appendChild(btn);
});

function showTab(id){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("active", b.dataset.id===id));
  document.querySelectorAll(".tabpanel").forEach(p=>p.classList.toggle("active", p.id==="panel-"+id));
}

// Build placeholder panels
tabs.forEach(t=>{
  const panel = document.createElement("div");
  panel.className = "tabpanel";
  panel.id = "panel-"+t.id;
  if(t.id==="physics"){
    panel.classList.add("active");
    panel.innerHTML = physicsTabHTML();
  } else {
    panel.innerHTML = `
      <div class="card placeholder-card">
        <span class="badge future">Coming soon</span>
        <h3>${t.label}</h3>
        <p class="sub">Planned components for this tab / sắp triển khai:</p>
        <ul>${t.items.map(x=>`<li>${x}</li>`).join("")}</ul>
      </div>`;
  }
  tabContent.appendChild(panel);
});

function physicsTabHTML(){
  return `
    <div class="grid-2">
      <div class="card">
        <span class="badge">Current stage</span>
        <h3>Physics model controls</h3>
        <p class="sub">Kelvin-Voigt core: F = k&middot;x + c&middot;ẋ &nbsp;&nbsp;(F in N, k in N/m, x in m, c in Ns/m, ẋ in m/s)</p>
        <div class="slider-row">
          <div class="label-row"><span>Stiffness k (N/m)</span><span class="val" id="kVal">200</span></div>
          <input type="range" id="kSlider" min="10" max="500" value="200">
        </div>
        <div class="slider-row">
          <div class="label-row"><span>Damping c (Ns/m)</span><span class="val" id="cVal">10</span></div>
          <input type="range" id="cSlider" min="0" max="50" value="10">
        </div>
        <div class="slider-row">
          <div class="label-row"><span>Indentation depth x (mm)</span><span class="val" id="xVal">5</span></div>
          <input type="range" id="xSlider" min="0" max="10" step="0.1" value="5">
        </div>
        <div class="slider-row">
          <div class="label-row"><span>Instantaneous velocity ẋ (mm/s)</span><span class="val" id="vVal">5</span></div>
          <input type="range" id="vSlider" min="0.1" max="50" step="0.1" value="5">
        </div>
      </div>

      <div>
        <div class="plots-row">
          <div class="card">
            <h3>Force vs. depth</h3>
            <p class="sub">Elastic response across indentation range</p>
            <canvas id="plotDepth" width="400" height="180"></canvas>
          </div>
          <div class="card">
            <h3>Force vs. time</h3>
            <p class="sub">One indent–hold–release cycle</p>
            <canvas id="plotTime" width="400" height="180"></canvas>
          </div>
        </div>

        <div class="panels-row">
          <div class="card" id="uncertaintyPanel">
            <h3>Parameter uncertainty</h3>
            <p class="sub">k, c confidence interval (bootstrap / least-squares)</p>
            <div class="ci-row">
              <div class="name">k</div>
              <div class="ci-bar"><div class="fill" id="ciK"></div></div>
              <div id="ciKLabel" style="font-size:12px;color:var(--text-muted);white-space:nowrap;"></div>
            </div>
            <div class="ci-row">
              <div class="name">c</div>
              <div class="ci-bar"><div class="fill" id="ciC"></div></div>
              <div id="ciCLabel" style="font-size:12px;color:var(--text-muted);white-space:nowrap;"></div>
            </div>
            <p class="note">Note: These confidence intervals are illustrative placeholders, not real computed results.</p>
          </div>

          <div class="card">
            <h3>Force decomposition</h3>
            <p class="sub">Elastic vs. viscous contribution, F = k&middot;x + c&middot;ẋ &nbsp;&nbsp;(F in N, k in N/m, x in m, c in Ns/m, ẋ in m/s)</p>
            <div class="stack-bar">
              <div class="elastic" id="elasticBar" style="width:60%"></div>
              <div class="viscous" id="viscousBar" style="width:40%"></div>
            </div>
            <div class="legend">
              <span><span class="dot elastic-dot"></span>Elastic — <span id="elasticPct">60%</span></span>
              <span><span class="dot viscous-dot"></span>Viscous — <span id="viscousPct">40%</span></span>
            </div>
            
            <div id="totalForceDisplay" style="margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--navy);">Total force F = 0.000 N</div>
            <div id="elasticFormula" style="margin-top: 6px; font-size: 11px; color: var(--text-muted); font-family: monospace; white-space: nowrap;"></div>
            <div id="viscousFormula" style="margin-top: 4px; font-size: 11px; color: var(--text-muted); font-family: monospace; white-space: nowrap;"></div>
            
            <p class="note">Recomputes live as you move the sliders above.</p>
          </div>
        </div>
      </div>
    </div>`;
}

function updateMonteCarloVisibility() {
  const mcToggle = document.getElementById("mcToggle");
  const uncertaintyPanel = document.getElementById("uncertaintyPanel");
  const panelsRow = document.querySelector(".panels-row");
  if (mcToggle && uncertaintyPanel) {
    const isMcOn = mcToggle.classList.contains("on");
    if (isMcOn) {
      uncertaintyPanel.style.display = "";
      if (panelsRow) panelsRow.classList.remove("mc-off");
    } else {
      uncertaintyPanel.style.display = "none";
      if (panelsRow) panelsRow.classList.add("mc-off");
    }
  }
}

function toggleMonteCarlo() {
  const mcToggle = document.getElementById("mcToggle");
  if (mcToggle) {
    mcToggle.classList.toggle("on");
    updateMonteCarloVisibility();
  }
}
window.toggleMonteCarlo = toggleMonteCarlo;

// wait for physics panel to be in DOM before wiring
requestAnimationFrame(initPhysicsTab);

function drawTooltip(ctx, text, x, y, canvasW, canvasH) {
  ctx.font = "11px sans-serif";
  const textWidth = ctx.measureText(text).width;
  const padX = 8, padY = 6;
  const boxW = textWidth + padX * 2;
  const boxH = 15 + padY * 2;
  
  let boxX = x + 10;
  let boxY = y - boxH - 10;
  if (boxX + boxW > canvasW - 5) {
    boxX = x - boxW - 10;
  }
  if (boxY < 5) {
    boxY = y + 10;
  }
  
  ctx.fillStyle = "rgba(15, 30, 46, 0.95)";
  ctx.shadowColor = "rgba(0, 0, 0, 0.15)";
  ctx.shadowBlur = 4;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
  
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(boxX, boxY, boxW, boxH, 6);
  } else {
    ctx.rect(boxX, boxY, boxW, boxH);
  }
  ctx.fill();
  
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
  
  ctx.fillStyle = "#FFFFFF";
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(text, boxX + padX, boxY + padY + 7.5);
}

function initPhysicsTab(){
  const kSlider = document.getElementById("kSlider");
  const cSlider = document.getElementById("cSlider");
  const xSlider = document.getElementById("xSlider");
  const vSlider = document.getElementById("vSlider");
  const kVal = document.getElementById("kVal");
  const cVal = document.getElementById("cVal");
  const xVal = document.getElementById("xVal");
  const vVal = document.getElementById("vVal");

  const canvasDepth = document.getElementById("plotDepth");
  const canvasTime = document.getElementById("plotTime");

  let depthHoverX = null;
  let timeHoverX = null;

  canvasDepth.addEventListener("mousemove", (e) => {
    const rect = canvasDepth.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x >= 55 && x <= canvasDepth.width - 15) {
      depthHoverX = x;
    } else {
      depthHoverX = null;
    }
    update();
  });
  canvasDepth.addEventListener("mouseleave", () => {
    depthHoverX = null;
    update();
  });

  canvasTime.addEventListener("mousemove", (e) => {
    const rect = canvasTime.getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x >= 55 && x <= canvasTime.width - 15) {
      timeHoverX = x;
    } else {
      timeHoverX = null;
    }
    update();
  });
  canvasTime.addEventListener("mouseleave", () => {
    timeHoverX = null;
    update();
  });

  function update(){
    const k = parseFloat(kSlider.value);
    const c = parseFloat(cSlider.value);
    const x = parseFloat(xSlider.value);
    const v = parseFloat(vSlider.value);
    kVal.textContent = k;
    cVal.textContent = c;
    xVal.textContent = x.toFixed(1);
    vVal.textContent = v.toFixed(1);

    // unit conversions: x in mm -> meters, v in mm/s -> m/s
    const x_m = x / 1000;
    const v_m = v / 1000;

    // uncertainty (illustrative bootstrap CI)
    const ciKWidth = k * 0.08;
    const ciCWidth = c * 0.15;
    document.getElementById("ciKLabel").textContent = `${k} ± ${ciKWidth.toFixed(1)} N/m`;
    document.getElementById("ciCLabel").textContent = `${c} ± ${ciCWidth.toFixed(1)} Ns/m`;

    // Map CI to slider ranges to calculate actual relative position
    const kMin = parseFloat(kSlider.min), kMax = parseFloat(kSlider.max), kRange = kMax - kMin;
    const ciKStart = Math.max(kMin, k - ciKWidth);
    const ciKEnd = Math.min(kMax, k + ciKWidth);
    const ciKLeft = ((ciKStart - kMin) / kRange) * 100;
    const ciKWidthPct = ((ciKEnd - ciKStart) / kRange) * 100;

    const cMin = parseFloat(cSlider.min), cMax = parseFloat(cSlider.max), cRange = cMax - cMin;
    const ciCStart = Math.max(cMin, c - ciCWidth);
    const ciCEnd = Math.min(cMax, c + ciCWidth);
    const ciCLeft = ((ciCStart - cMin) / cRange) * 100;
    const ciCWidthPct = ((ciCEnd - ciCStart) / cRange) * 100;

    document.getElementById("ciK").style.left = ciKLeft + "%";
    document.getElementById("ciK").style.width = ciKWidthPct + "%";
    document.getElementById("ciC").style.left = ciCLeft + "%";
    document.getElementById("ciC").style.width = ciCWidthPct + "%";

    // decomposition
    const fElastic = k * x_m;
    const fViscous = c * v_m;
    const totalForce = fElastic + fViscous;
    const totalDiv = totalForce === 0 ? 1 : totalForce;
    const pElastic = totalForce === 0 ? 0 : Math.round(fElastic/totalDiv*100);
    const pViscous = totalForce === 0 ? 0 : 100 - pElastic;
    document.getElementById("elasticBar").style.width = pElastic+"%";
    document.getElementById("viscousBar").style.width = pViscous+"%";
    document.getElementById("elasticPct").textContent = pElastic+"%";
    document.getElementById("viscousPct").textContent = pViscous+"%";

    // Display total force and calculation formulas
    document.getElementById("totalForceDisplay").textContent = `Total force F = ${totalForce.toFixed(3)} N`;
    document.getElementById("elasticFormula").innerHTML = `F<sub>elastic</sub> = k &times; x<sub>m</sub> = ${k} N/m &times; ${x_m.toFixed(4)} m = ${fElastic.toFixed(3)} N`;
    document.getElementById("viscousFormula").innerHTML = `F<sub>viscous</sub> = c &times; v<sub>m</sub> = ${c} Ns/m &times; ${v_m.toFixed(4)} m/s = ${fViscous.toFixed(3)} N`;

    const xMax = parseFloat(xSlider.max);
    const depthYMax = kMax * (xMax / 1000);
    drawDepthPlot(k, x, depthYMax, depthHoverX);
    drawTimePlot(k, c, x, timeHoverX);
  }

  [kSlider,cSlider,xSlider,vSlider].forEach(s=>s.addEventListener("input", update));
  update();
  updateMonteCarloVisibility();
}

function drawDepthPlot(k, xCurrent, yMax, hoverX){
  const canvas = document.getElementById("plotDepth");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const padLeft = 55, padBottom = 35, padRight = 15, padTop = 15;
  const plotW = W - padLeft - padRight;
  const plotH = H - padBottom - padTop;
  
  ctx.clearRect(0,0,W,H);
  
  // 1. Draw gridlines
  const xMax = 10;
  const xTicks = [0, 2, 4, 6, 8, 10];
  xTicks.forEach(tick => {
    const px = padLeft + (tick / xMax) * plotW;
    ctx.strokeStyle = "#EDF1F3";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, H - padBottom);
    ctx.lineTo(px, padTop);
    ctx.stroke();
  });

  const yTicks = [0, 1, 2, 3, 4, 5];
  yTicks.forEach(tick => {
    const py = H - padBottom - (tick / yMax) * plotH;
    ctx.strokeStyle = "#EDF1F3";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, py);
    ctx.lineTo(W - padRight, py);
    ctx.stroke();
  });

  // 2. Draw axis lines
  ctx.strokeStyle = "#D8DEE2";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padLeft, H - padBottom);
  ctx.lineTo(W - padRight, H - padBottom);
  ctx.moveTo(padLeft, H - padBottom);
  ctx.lineTo(padLeft, padTop);
  ctx.stroke();

  // 3. Draw tick marks and numeric labels
  xTicks.forEach(tick => {
    const px = padLeft + (tick / xMax) * plotW;
    ctx.strokeStyle = "#D8DEE2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, H - padBottom);
    ctx.lineTo(px, H - padBottom + 4);
    ctx.stroke();

    ctx.fillStyle = "#5C6B73";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(tick + " mm", px, H - padBottom + 6);
  });

  yTicks.forEach(tick => {
    const py = H - padBottom - (tick / yMax) * plotH;
    ctx.strokeStyle = "#D8DEE2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, py);
    ctx.lineTo(padLeft - 4, py);
    ctx.stroke();

    ctx.fillStyle = "#5C6B73";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(tick + " N", padLeft - 8, py);
  });

  // 4. Draw curves
  ctx.strokeStyle = "#378ADD";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i=0;i<=100;i++){
    const x = i/100*xMax;
    const f = k * (x / 1000);
    const px = padLeft + (x/xMax)*plotW;
    const py = H-padBottom - (f/yMax)*plotH;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // current point
  const px = padLeft + (xCurrent/xMax)*plotW;
  const py = H-padBottom - (k*(xCurrent/1000)/yMax)*plotH;
  ctx.fillStyle = "#0F6E56";
  ctx.beginPath(); ctx.arc(px,py,4,0,2*Math.PI); ctx.fill();

  // Axis titles
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillStyle = "#5C6B73";
  ctx.font = "11px sans-serif";
  ctx.fillText("depth (mm)", padLeft + plotW / 2, H - 2);

  ctx.save();
  ctx.translate(12, padTop + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("force (N)", 0, 0);
  ctx.restore();

  // Hover tooltip
  if (hoverX !== null && hoverX !== undefined) {
    const xHover = ((hoverX - padLeft) / plotW) * xMax;
    const fHover = k * (xHover / 1000);
    const pyHover = H - padBottom - (fHover / yMax) * plotH;

    ctx.strokeStyle = "rgba(92, 107, 115, 0.4)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(hoverX, H - padBottom);
    ctx.lineTo(hoverX, padTop);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#378ADD";
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hoverX, pyHover, 6, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();

    const tooltipText = `x = ${xHover.toFixed(2)} mm, F = ${fHover.toFixed(3)} N`;
    drawTooltip(ctx, tooltipText, hoverX, pyHover, W, H);
  }
}

function drawTimePlot(k, c, xTarget, hoverX){
  const canvas = document.getElementById("plotTime");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const padLeft = 55, padBottom = 35, padRight = 15, padTop = 15;
  const plotW = W - padLeft - padRight;
  const plotH = H - padBottom - padTop;
  
  ctx.clearRect(0,0,W,H);

  // triangular indent-hold-release profile over t in [0,3]
  const T = 3, rampT = 0.8;
  function xOfT(t){
    if(t < rampT) return xTarget*(t/rampT);
    if(t < T-rampT) return xTarget;
    return xTarget*((T-t)/rampT);
  }
  function vOfT(t){
    const dt=0.01;
    return (xOfT(t+dt)-xOfT(t-dt))/(2*dt);
  }
  let maxF = 1;
  const pts = [];
  for(let i=0;i<=100;i++){
    const t = i/100*T;
    const x = xOfT(t), v = vOfT(t);
    const f = k * (x / 1000) + c * (v / 1000);
    pts.push([t,f]);
    if(Math.abs(f)>maxF) maxF = Math.abs(f);
  }

  const margin = 0.05;
  const pyOfF = (f) => {
    const norm = (f + maxF) / (2 * maxF);
    const scaled = margin + norm * (1 - 2 * margin);
    return H - padBottom - scaled * plotH;
  };

  // 1. Draw gridlines
  const tTicks = [0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0];
  tTicks.forEach(tick => {
    const px = padLeft + (tick / T) * plotW;
    ctx.strokeStyle = "#EDF1F3";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, H - padBottom);
    ctx.lineTo(px, padTop);
    ctx.stroke();
  });

  const yTicks = [-maxF, -maxF/2, 0, maxF/2, maxF];
  yTicks.forEach(tick => {
    const py = pyOfF(tick);
    ctx.strokeStyle = "#EDF1F3";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, py);
    ctx.lineTo(W - padRight, py);
    ctx.stroke();
  });

  // 2. Draw axis lines
  ctx.strokeStyle = "#D8DEE2";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padLeft, H - padBottom);
  ctx.lineTo(W - padRight, H - padBottom);
  ctx.moveTo(padLeft, H - padBottom);
  ctx.lineTo(padLeft, padTop);
  ctx.stroke();

  // 3. Draw tick marks and numeric labels
  tTicks.forEach(tick => {
    const px = padLeft + (tick / T) * plotW;
    ctx.strokeStyle = "#D8DEE2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(px, H - padBottom);
    ctx.lineTo(px, H - padBottom + 4);
    ctx.stroke();

    ctx.fillStyle = "#5C6B73";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(tick.toFixed(1) + " s", px, H - padBottom + 6);
  });

  yTicks.forEach(tick => {
    const py = pyOfF(tick);
    ctx.strokeStyle = "#D8DEE2";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, py);
    ctx.lineTo(padLeft - 4, py);
    ctx.stroke();

    ctx.fillStyle = "#5C6B73";
    ctx.font = "11px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    const labelVal = Math.abs(tick) < 1e-5 ? "0.00 N" : tick.toFixed(2) + " N";
    ctx.fillText(labelVal, padLeft - 8, py);
  });

  // 4. Draw curves
  ctx.strokeStyle = "#1D9E75";
  ctx.lineWidth = 2;
  ctx.beginPath();
  pts.forEach(([t,f],i)=>{
    const px = padLeft + (t/T)*plotW;
    const py = pyOfF(f);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  });
  ctx.stroke();

  // Axis titles
  ctx.textAlign = "center";
  ctx.textBaseline = "bottom";
  ctx.fillStyle = "#5C6B73";
  ctx.font = "11px sans-serif";
  ctx.fillText("time (s)", padLeft + plotW / 2, H - 2);

  ctx.save();
  ctx.translate(12, padTop + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("force (N)", 0, 0);
  ctx.restore();

  // Hover tooltip
  if (hoverX !== null && hoverX !== undefined) {
    const tHover = ((hoverX - padLeft) / plotW) * T;
    const index = Math.round((tHover / T) * 100);
    const clampedIndex = Math.max(0, Math.min(100, index));
    const pt = pts[clampedIndex];
    const tVal = pt[0];
    const fVal = pt[1];
    const pxHover = padLeft + (tVal / T) * plotW;
    const pyHover = pyOfF(fVal);

    ctx.strokeStyle = "rgba(92, 107, 115, 0.4)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(pxHover, H - padBottom);
    ctx.lineTo(pxHover, padTop);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#1D9E75";
    ctx.strokeStyle = "#FFFFFF";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pxHover, pyHover, 6, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();

    const tooltipText = `t = ${tVal.toFixed(2)} s, F = ${fVal.toFixed(3)} N`;
    drawTooltip(ctx, tooltipText, pxHover, pyHover, W, H);
  }
</script>
