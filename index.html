<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TissueSense — Physics-Informed Force Estimation</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <h1>TissueSense</h1>
  <p class="tagline">Physics-informed force estimation for haptic feedback in simulated robotic surgery</p>
  <div class="accent-line"></div>
</header>

<div class="global-bar">
  <div class="control">
    <label>Tissue type</label>
    <select id="tissueType">
      <option>Liver</option>
      <option>Skin</option>
      <option>Muscle</option>
      <option>Fat</option>
    </select>
  </div>
  <div class="control">
    <label>Viscoelastic model</label>
    <select id="modelType">
      <option>Kelvin-Voigt</option>
      <option disabled>Maxwell (coming soon)</option>
      <option disabled>Standard Linear Solid (Zener) (coming soon)</option>
      <option disabled>Generalized Maxwell (coming soon)</option>
      <option disabled>Fung's QLV (coming soon)</option>
      <option disabled>Fractional-order (coming soon)</option>
    </select>
  </div>
  <div class="control">
    <label>Tool type <span style="opacity:.6;font-weight:400;">(future work)</span></label>
    <select id="toolType">
      <option>Needle tip</option>
      <option>Flat grasper</option>
      <option>Spherical probe</option>
    </select>
  </div>
  <div class="toggle-wrap">
    <label>Monte Carlo</label>
    <div class="switch on" id="mcToggle"><div class="knob"></div></div>
  </div>
</div>

<nav class="tabs" id="tabNav"></nav>

<main>
  <div id="tabContent"></div>
</main>
<script type="module" src="./js/main.js"></script>
</body>
</html>
